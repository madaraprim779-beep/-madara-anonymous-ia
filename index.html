
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090d">
<title>MADARA AI</title>
<style>
:root {
  --red: #ff2638;
  --bg: #09090d;
  --panel: #14141c;
  --text: #f5f5f7;
  --muted: #9999a8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
  min-height: 100dvh;
}
header {
  height: 66px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #292933;
}
.logo {
  width: 39px; height: 39px;
  border-radius: 12px;
  background: var(--red);
  display: grid; place-items: center;
  font-size: 21px; font-weight: 900;
}
.brand { font-size: 19px; font-weight: 850; }
.brand span { color: var(--red); }
.status {
  margin-left: auto;
  font-size: 11px; color: #8ee8aa;
}
main {
  width: min(100%, 850px);
  margin: auto;
  padding: 25px 16px 155px;
}
.welcome { text-align: center; padding: 35px 0 20px; }
.welcome h1 { font-size: clamp(30px, 7vw, 48px); margin: 0 0 12px; }
.welcome h1 span { color: var(--red); }
.welcome p { color: var(--muted); line-height: 1.6; }
#messages { display: flex; flex-direction: column; gap: 18px; }
.message { display: flex; gap: 10px; align-items: flex-start; }
.avatar {
  flex: 0 0 34px; height: 34px;
  display: grid; place-items: center;
  background: #29202a; border-radius: 10px;
  font-size: 12px; font-weight: 800;
}
.message.user .avatar { background: #3a1820; }
.bubble {
  min-width: 0; max-width: calc(100% - 44px);
  background: var(--panel); padding: 13px 15px;
  border: 1px solid #282832;
  border-radius: 5px 15px 15px 15px;
  line-height: 1.65; overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.message.user { flex-direction: row-reverse; }
.message.user .bubble {
  background: #28141a; border-color: #54202a;
  border-radius: 15px 5px 15px 15px;
}
.composer {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, var(--bg) 18%);
}
.composer-inner { max-width: 820px; margin: auto; }
.inputbox {
  display: flex; align-items: flex-end; gap: 9px;
  padding: 10px; background: #17171f;
  border: 1px solid #383843; border-radius: 18px;
}
textarea {
  flex: 1; min-width: 0; max-height: 140px;
  resize: none; border: 0; outline: 0;
  background: transparent; color: white;
  font: inherit; padding: 9px 4px;
}
button {
  border: 0; cursor: pointer; font: inherit;
}
#send {
  width: 43px; height: 43px; border-radius: 13px;
  background: var(--red); color: white;
  font-size: 20px; font-weight: 800;
}
#send:disabled { opacity: .45; }
.hint { color: var(--muted); text-align: center; font-size: 11px; margin: 9px 0 0; }
.actions { display: flex; justify-content: flex-end; margin-bottom: 8px; }
#clear {
  background: transparent; color: var(--muted);
  font-size: 12px; padding: 8px;
}
</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <div class="brand">MADARA <span>AI</span></div>
  <div class="status">● EN LIGNE</div>
</header>

<main>
  <section class="welcome" id="welcome">
    <h1>TON ESPRIT.<br><span>SANS LIMITES.</span></h1>
    <p>Une IA polyvalente pour réfléchir, apprendre,<br>
    programmer et créer avec toi.</p>
  </section>

  <div id="messages" aria-live="polite"></div>
</main>

<div class="composer">
  <div class="composer-inner">
    <div class="actions">
      <button id="clear">Nouvelle conversation ↺</button>
    </div>
    <form id="form" class="inputbox">
      <textarea id="prompt" rows="1" maxlength="4000"
        placeholder="Écris à MADARA AI..." required></textarea>
      <button id="send" aria-label="Envoyer">↑</button>
    </form>
    <p class="hint">MADARA AI peut se tromper. Vérifie les informations importantes.</p>
  </div>
</div>

<script>
const form = document.getElementById("form");
const input = document.getElementById("prompt");
const messagesEl = document.getElementById("messages");
const send = document.getElementById("send");
const welcome = document.getElementById("welcome");

let history = [];
let busy = false;

function addMessage(role, text) {
  const item = document.createElement("div");
  item.className = "message " + (role === "user" ? "user" : "assistant");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "TOI" : "M";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  item.append(avatar, bubble);
  messagesEl.appendChild(item);
  item.scrollIntoView({ behavior: "smooth", block: "end" });
  return bubble;
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const prompt = input.value.trim();
  if (!prompt || busy) return;

  welcome.hidden = true;
  addMessage("user", prompt);
  history.push({ role: "user", content: prompt });

  input.value = "";
  input.style.height = "auto";
  busy = true;
  send.disabled = true;

  const reply = addMessage("assistant", "MADARA réfléchit...");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });

    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || "Erreur du serveur.");
    }

    reply.textContent = data.reply;
    history.push({ role: "assistant", content: data.reply });
  } catch (error) {
    const message = error.message || "Connexion impossible.";
    reply.textContent = "Erreur : " + message;
    history.pop();
  } finally {
    busy = false;
    send.disabled = false;
    input.focus();
  }
});

document.getElementById("clear").addEventListener("click", () => {
  if (busy) return;
  history = [];
  messagesEl.replaceChildren();
  welcome.hidden = false;
  input.value = "";
  input.focus();
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
